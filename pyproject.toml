[project]
name = "ai-intelligent-platform"
version = "0.0.0"
description = "AI 智能平台 Python 工程与质量工具入口"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "argon2-cffi==25.1.0",
    "celery==5.5.3",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "minio==7.2.15",
    "opentelemetry-api==1.38.0",
    "opentelemetry-exporter-otlp-proto-http==1.38.0",
    "opentelemetry-sdk==1.38.0",
    "pdfplumber==0.11.10",
    "pgvector==0.4.1",
    "prometheus-client==0.23.1",
    "psycopg[binary]==3.2.10",
    "pydantic-settings==2.11.0",
    "python-multipart==0.0.20",
    "redis==6.4.0",
    "sqlalchemy==2.0.44",
    "uvicorn[standard]==0.37.0",
]

[dependency-groups]
ai-validation = [
    "huggingface-hub==1.27.0",
    "torch==2.13.0",
    "transformers==5.15.0",
]
dev = [
  "httpx==0.28.1",
  "httpx2==2.10.0",
  "jsonschema[format]==4.25.1",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.3",
  "types-jsonschema==4.25.1.20251009",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
pythonpath = [".", "apps/api/src", "apps/worker/src", "packages/backend/src"]
testpaths = ["tests", "apps/api/tests", "apps/worker/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ai_platform_api.*", "ai_platform_worker.*", "ai_platform_backend.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# pgvector 0.4.1 尚未发布 PEP 561 标记，调用处仍由 SQLAlchemy 类型与集成测试约束。
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery 5.5 未发布 PEP 561 标记；例外仅覆盖 Worker 接入层，业务与共享内核仍执行 strict。
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery 的 shared_task 装饰器没有可消费类型，只在任务注册边缘关闭该单项检查。
module = ["ai_platform_worker.consumers.integration_events"]
disallow_untyped_decorators = false
