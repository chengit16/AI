name: ai-intelligent-platform

x-python-environment: &python-environment
  AI_PLATFORM_ENVIRONMENT: local
  AI_PLATFORM_VERSION: 0.0.0
  AI_PLATFORM_DEPENDENCY_CHECKS_ENABLED: "true"
  # 未配置 Collector 时保持空值，应用仍输出结构化日志和 Prometheus 指标。
  AI_PLATFORM_OBSERVABILITY_OTLP_ENDPOINT: ${OBSERVABILITY_OTLP_ENDPOINT:-}
  AI_PLATFORM_OBSERVABILITY_OTLP_TIMEOUT_SECONDS: ${OBSERVABILITY_OTLP_TIMEOUT_SECONDS:-2}
  AI_PLATFORM_OBSERVABILITY_SAFE_LIBRARY_LOGGING: "true"
  PROMETHEUS_MULTIPROC_DIR: /var/run/ai-platform-prometheus
  AI_PLATFORM_DATABASE_URL: postgresql+psycopg://ai_platform:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/ai_platform
  # Valkey 使用 RESP 协议，连接 URI 保留标准 redis:// Scheme 以兼容现有客户端生态。
  AI_PLATFORM_VALKEY_URL: redis://valkey:6379/0
  AI_PLATFORM_MINIO_ENDPOINT: http://minio:9000
  AI_PLATFORM_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ai-platform-local}
  AI_PLATFORM_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-development-only}
  AI_PLATFORM_MINIO_BUCKET: ${MINIO_BUCKET:-ai-platform-documents}
  AI_PLATFORM_UPLOAD_MAX_FILE_SIZE_BYTES: ${UPLOAD_MAX_FILE_SIZE_BYTES:-20971520}
  AI_PLATFORM_INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
  AI_PLATFORM_INGESTION_BATCH_SIZE: ${INGESTION_BATCH_SIZE:-4}
  AI_PLATFORM_INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-120}
  AI_PLATFORM_INGESTION_RETRY_BASE_SECONDS: ${INGESTION_RETRY_BASE_SECONDS:-5}
  AI_PLATFORM_INGESTION_DISPATCH_INTERVAL_SECONDS: ${INGESTION_DISPATCH_INTERVAL_SECONDS:-2}
  AI_PLATFORM_INGESTION_MAX_FILE_SIZE_BYTES: ${INGESTION_MAX_FILE_SIZE_BYTES:-20971520}
  AI_PLATFORM_INGESTION_MAX_PAGE_COUNT: ${INGESTION_MAX_PAGE_COUNT:-500}
  AI_PLATFORM_INDEXING_BATCH_SIZE: ${INDEXING_BATCH_SIZE:-4}
  AI_PLATFORM_INDEXING_LEASE_SECONDS: ${INDEXING_LEASE_SECONDS:-120}
  AI_PLATFORM_INDEXING_MAX_ATTEMPTS: ${INDEXING_MAX_ATTEMPTS:-3}
  AI_PLATFORM_INDEXING_RETRY_BASE_SECONDS: ${INDEXING_RETRY_BASE_SECONDS:-5}
  AI_PLATFORM_INDEXING_DISPATCH_INTERVAL_SECONDS: ${INDEXING_DISPATCH_INTERVAL_SECONDS:-2}
  AI_PLATFORM_INDEX_INSPECTION_INTERVAL_SECONDS: ${INDEX_INSPECTION_INTERVAL_SECONDS:-300}
  AI_PLATFORM_INDEXING_MAX_CHUNK_CHARS: ${INDEXING_MAX_CHUNK_CHARS:-1500}
  AI_PLATFORM_INDEXING_CHUNK_OVERLAP_CHARS: ${INDEXING_CHUNK_OVERLAP_CHARS:-150}
  AI_PLATFORM_INDEXING_CHUNKER_VERSION: ${INDEXING_CHUNKER_VERSION:-structural-char-v1}
  AI_PLATFORM_TIKA_URL: http://tika:9998
  AI_PLATFORM_MODEL_PROVIDER: mock
  AI_PLATFORM_MODEL_PROVIDER_ALLOWED_HOSTS: ${MODEL_PROVIDER_ALLOWED_HOSTS:-[]}
  # 仅供 local/test 下的 Clash Fake-IP；应用仍限制为 RFC 2544 基准网段。
  AI_PLATFORM_MODEL_PROVIDER_ALLOWED_RESOLVED_NETWORKS: ${MODEL_PROVIDER_ALLOWED_RESOLVED_NETWORKS:-[]}
  AI_PLATFORM_MODEL_PROVIDER_PROBE_TIMEOUT_SECONDS: ${MODEL_PROVIDER_PROBE_TIMEOUT_SECONDS:-10}
  # Pub/Sub 只缩短跨实例等待；连接失败后仍按该轮询周期回查 PostgreSQL 事实。
  AI_PLATFORM_STREAM_POLL_INTERVAL_MS: ${STREAM_POLL_INTERVAL_MS:-250}
  AI_PLATFORM_STREAM_NOTIFICATION_CONNECT_TIMEOUT_SECONDS: ${STREAM_NOTIFICATION_CONNECT_TIMEOUT_SECONDS:-0.5}
  # 当前指针短缓存与不可变绑定长缓存分别配置，Source 故障时只在有效租期内降级。
  AI_PLATFORM_RUNTIME_CURRENT_CACHE_TTL_SECONDS: ${RUNTIME_CURRENT_CACHE_TTL_SECONDS:-300}
  AI_PLATFORM_RUNTIME_BOUND_CACHE_TTL_SECONDS: ${RUNTIME_BOUND_CACHE_TTL_SECONDS:-86400}
  AI_PLATFORM_RUNTIME_CACHE_TIMEOUT_SECONDS: ${RUNTIME_CACHE_TIMEOUT_SECONDS:-0.5}
  # 本地首次问答自动建立不联网的合成 Provider；真实供应商配置与调用路径保持独立。
  AI_PLATFORM_LOCAL_MOCK_BOOTSTRAP_ENABLED: ${AI_PLATFORM_LOCAL_MOCK_BOOTSTRAP_ENABLED:-true}
  AI_PLATFORM_MASTER_KEY_VERSION: ${MASTER_KEY_VERSION:-1}

x-worker-common: &worker-common
  image: ai-platform-worker:local
  build:
    context: ../..
    dockerfile: infra/docker/worker.Dockerfile
  volumes:
    - ${AI_PLATFORM_ROOT:-../../.ai-platform}/secrets/task-signing.key:/run/secrets/ai-platform-task-signing.key:ro
    - ${AI_PLATFORM_ROOT:-../../.ai-platform}/runtime/prometheus:/var/run/ai-platform-prometheus
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    minio:
      condition: service_healthy
    tika:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: ai_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.5-alpine@sha256:918228e4ff7da6b3a4213cb18067f6e09d9f0503d0a08868699ba227cff71861
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/data/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ai-platform-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/data/objects:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tika:
    image: ai-platform-tika:3.2.3-chi-sim
    build:
      context: ../..
      dockerfile: infra/docker/tika.Dockerfile
    ports:
      - "127.0.0.1:${TIKA_PORT:-9998}:9998"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9998/version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *python-environment
      AI_PLATFORM_MASTER_KEY_PATH: /run/secrets/ai-platform-master.key
    ports:
      - "127.0.0.1:${AI_PLATFORM_API_PORT:-8000}:8000"
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/secrets/master.key:/run/secrets/ai-platform-master.key:ro
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/runtime/prometheus:/var/run/ai-platform-prometheus
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      tika:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *python-environment
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/runtime/prometheus:/var/run/ai-platform-prometheus
    command:
      [
        "sh",
        "-c",
        "find /var/run/ai-platform-prometheus -type f -name '*.db' -delete && uv run --no-sync alembic upgrade head",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker-control:
    <<: *worker-common
    environment:
      <<: *python-environment
      AI_PLATFORM_TASK_SIGNING_KEY_PATH: /run/secrets/ai-platform-task-signing.key
      AI_PLATFORM_WORKER_LANE: control
      AI_PLATFORM_CONTROL_WORKER_CONCURRENCY: ${CONTROL_WORKER_CONCURRENCY:-2}
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "celery",
        "-A",
        "ai_platform_worker.app.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=platform.control",
        "--hostname=control@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(wc -c </run/secrets/ai-platform-task-signing.key 2>/dev/null)\" -eq 32 && uv run --no-sync celery -A ai_platform_worker.app.celery_app:celery_app inspect ping --destination control@$$HOSTNAME --timeout 3 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker-parsing:
    <<: *worker-common
    environment:
      <<: *python-environment
      AI_PLATFORM_TASK_SIGNING_KEY_PATH: /run/secrets/ai-platform-task-signing.key
      AI_PLATFORM_WORKER_LANE: parsing
      AI_PLATFORM_PARSING_WORKER_CONCURRENCY: ${PARSING_WORKER_CONCURRENCY:-2}
    command: ["uv", "run", "--no-sync", "celery", "-A", "ai_platform_worker.app.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=platform.parsing", "--hostname=parsing@%h"]
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(wc -c </run/secrets/ai-platform-task-signing.key 2>/dev/null)\" -eq 32 && uv run --no-sync celery -A ai_platform_worker.app.celery_app:celery_app inspect ping --destination parsing@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker-ocr:
    <<: *worker-common
    environment:
      <<: *python-environment
      AI_PLATFORM_TASK_SIGNING_KEY_PATH: /run/secrets/ai-platform-task-signing.key
      AI_PLATFORM_WORKER_LANE: ocr
      AI_PLATFORM_OCR_WORKER_CONCURRENCY: ${OCR_WORKER_CONCURRENCY:-1}
    command: ["uv", "run", "--no-sync", "celery", "-A", "ai_platform_worker.app.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=platform.ocr", "--hostname=ocr@%h"]
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(wc -c </run/secrets/ai-platform-task-signing.key 2>/dev/null)\" -eq 32 && uv run --no-sync celery -A ai_platform_worker.app.celery_app:celery_app inspect ping --destination ocr@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker-embedding:
    <<: *worker-common
    environment:
      <<: *python-environment
      AI_PLATFORM_TASK_SIGNING_KEY_PATH: /run/secrets/ai-platform-task-signing.key
      AI_PLATFORM_WORKER_LANE: embedding
      AI_PLATFORM_EMBEDDING_WORKER_CONCURRENCY: ${EMBEDDING_WORKER_CONCURRENCY:-1}
    command: ["uv", "run", "--no-sync", "celery", "-A", "ai_platform_worker.app.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=platform.embedding", "--hostname=embedding@%h"]
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(wc -c </run/secrets/ai-platform-task-signing.key 2>/dev/null)\" -eq 32 && uv run --no-sync celery -A ai_platform_worker.app.celery_app:celery_app inspect ping --destination embedding@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker-indexing:
    <<: *worker-common
    environment:
      <<: *python-environment
      AI_PLATFORM_TASK_SIGNING_KEY_PATH: /run/secrets/ai-platform-task-signing.key
      AI_PLATFORM_WORKER_LANE: indexing
      AI_PLATFORM_INDEXING_WORKER_CONCURRENCY: ${INDEXING_WORKER_CONCURRENCY:-2}
    command: ["uv", "run", "--no-sync", "celery", "-A", "ai_platform_worker.app.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=platform.indexing", "--hostname=indexing@%h"]
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(wc -c </run/secrets/ai-platform-task-signing.key 2>/dev/null)\" -eq 32 && uv run --no-sync celery -A ai_platform_worker.app.celery_app:celery_app inspect ping --destination indexing@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  scheduler:
    <<: *worker-common
    environment:
      <<: *python-environment
      AI_PLATFORM_WORKER_LANE: scheduler
    # Scheduler 只发布固定周期任务，不处理或签署业务信封，因此不挂载任务签名密钥。
    volumes: []
    command: ["uv", "run", "--no-sync", "celery", "-A", "ai_platform_worker.app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q celery /proc/1/cmdline && grep -q beat /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:${AI_PLATFORM_WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
