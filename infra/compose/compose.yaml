name: ai-intelligent-platform

x-python-environment: &python-environment
  AI_PLATFORM_ENVIRONMENT: local
  AI_PLATFORM_VERSION: 0.0.0
  AI_PLATFORM_DEPENDENCY_CHECKS_ENABLED: "true"
  AI_PLATFORM_DATABASE_URL: postgresql+psycopg://ai_platform:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/ai_platform
  # Valkey 使用 RESP 协议，连接 URI 保留标准 redis:// Scheme 以兼容现有客户端生态。
  AI_PLATFORM_VALKEY_URL: redis://valkey:6379/0
  AI_PLATFORM_MINIO_ENDPOINT: http://minio:9000
  AI_PLATFORM_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ai-platform-local}
  AI_PLATFORM_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-development-only}
  AI_PLATFORM_MINIO_BUCKET: ${MINIO_BUCKET:-ai-platform-documents}
  AI_PLATFORM_UPLOAD_MAX_FILE_SIZE_BYTES: ${UPLOAD_MAX_FILE_SIZE_BYTES:-20971520}
  AI_PLATFORM_INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
  AI_PLATFORM_INDEXING_BATCH_SIZE: ${INDEXING_BATCH_SIZE:-4}
  AI_PLATFORM_INDEXING_LEASE_SECONDS: ${INDEXING_LEASE_SECONDS:-120}
  AI_PLATFORM_INDEXING_MAX_ATTEMPTS: ${INDEXING_MAX_ATTEMPTS:-3}
  AI_PLATFORM_INDEXING_RETRY_BASE_SECONDS: ${INDEXING_RETRY_BASE_SECONDS:-5}
  AI_PLATFORM_INDEXING_DISPATCH_INTERVAL_SECONDS: ${INDEXING_DISPATCH_INTERVAL_SECONDS:-2}
  AI_PLATFORM_INDEXING_MAX_CHUNK_CHARS: ${INDEXING_MAX_CHUNK_CHARS:-1500}
  AI_PLATFORM_INDEXING_CHUNK_OVERLAP_CHARS: ${INDEXING_CHUNK_OVERLAP_CHARS:-150}
  AI_PLATFORM_INDEXING_CHUNKER_VERSION: ${INDEXING_CHUNKER_VERSION:-structural-char-v1}
  AI_PLATFORM_TIKA_URL: http://tika:9998
  AI_PLATFORM_MODEL_PROVIDER: mock

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: ai_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.5-alpine@sha256:918228e4ff7da6b3a4213cb18067f6e09d9f0503d0a08868699ba227cff71861
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/data/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ai-platform-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/data/objects:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tika:
    image: ai-platform-tika:3.2.3-chi-sim
    build:
      context: ../..
      dockerfile: infra/docker/tika.Dockerfile
    ports:
      - "127.0.0.1:${TIKA_PORT:-9998}:9998"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9998/version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *python-environment
      AI_PLATFORM_MASTER_KEY_PATH: /run/secrets/ai-platform-master.key
    ports:
      - "127.0.0.1:${AI_PLATFORM_API_PORT:-8000}:8000"
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/secrets/master.key:/run/secrets/ai-platform-master.key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      tika:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *python-environment
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *python-environment
      AI_PLATFORM_TASK_SIGNING_KEY_PATH: /run/secrets/ai-platform-task-signing.key
    volumes:
      - ${AI_PLATFORM_ROOT:-../../.ai-platform}/secrets/task-signing.key:/run/secrets/ai-platform-task-signing.key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      tika:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run --no-sync celery -A ai_platform_worker.app.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:${AI_PLATFORM_WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
