server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/api/v1/workspaces/[^/]+/knowledge-bases/[^/]+/documents/(upload|[^/]+/versions/upload)$ {
        # API 最大允许 100 MiB 文件；额外空间只承载 multipart 元数据，实际文件上限仍由 API 校验。
        client_max_body_size 101m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
